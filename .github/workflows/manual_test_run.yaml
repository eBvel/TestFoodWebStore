name: manual_run

on:
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker
        uses: docker/build-push-action@v7
        with:
          tags: tests_runner

      - name: Run tests
        run: docker run --rm --mount type=bind,src=${{ github.workspace }},target=/test_app tests_runner


