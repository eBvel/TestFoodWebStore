name: manual_run

on:
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tests_runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save tests_runner -o /tmp/tests_runner.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
            name: tests_runner_image
            path: /tmp/tests_runner.tar
            retention-days: 1

  tests:
    needs: build_image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [ 1, 2, 3, 4 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v6
        with:
          name: tests_runner_image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/tests_runner.tar

      - name: Run tests ( ${{ matrix.group }}/4 )
        run: > 
          docker run
          --shm-size=1g
          --rm 
          --mount type=bind,src=${{ github.workspace }},target=/test_app
          -e GROUP_NUMBER=${{ matrix.group }} 
          -e TOTAL_SPLITS=4
          -e USER1_LOGIN=${{ secrets.USER1_LOGIN }} -e USER1_PASSWORD=${{ secrets.USER1_PASSWORD }}
          -e USER2_LOGIN=${{ secrets.USER2_LOGIN }} -e USER2_PASSWORD=${{ secrets.USER2_PASSWORD }}
          -e USER3_LOGIN=${{ secrets.USER3_LOGIN }} -e USER3_PASSWORD=${{ secrets.USER3_PASSWORD }}
          -e USER4_LOGIN=${{ secrets.USER4_LOGIN }} -e USER4_PASSWORD=${{ secrets.USER4_PASSWORD }}
          -e ADMIN_LOGIN=${{ secrets.ADMIN_LOGIN }} -e ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} 
          tests_runner
        continue-on-error: true